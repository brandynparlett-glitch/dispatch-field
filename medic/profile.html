<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medic Profile</title>

<!-- Medic profile styles -->
<link rel="stylesheet" href="./medic.css">
</head>
<body>

<h1>Medic Profile</h1>
<p class="subtitle">Headshot only. City-only location (no full address).</p>

<form id="medicProfileForm">

<!-- 1) MEDIC IDENTITY -->
<section class="section">
<h2>Medic</h2>

<label for="medicName">Full name</label>
<input
id="medicName"
name="medicName"
type="text"
placeholder="e.g., Jordan Smith"
required
/>

<label for="headshot">Headshot (headshot only)</label>
<input
type="file"
id="headshot"
name="headshot"
accept="image/*"
/>

<div class="headshot-preview">
<img id="headshotPreview" alt="Headshot preview" />
</div>
</section>

<!-- 2) CONTACT -->
<section class="section">
<h2>Contact</h2>

<label for="phone">Mobile phone</label>
<input
id="phone"
name="phone"
type="tel"
placeholder="e.g., 780-555-0123"
required
/>

<label for="email">Email (optional)</label>
<input
id="email"
name="email"
type="email"
placeholder="e.g., name@email.com"
/>
</section>

<!-- 3) TICKETS / CERTS (RADIO BUTTONS THAT WORK) -->
<section class="section">
<h2>Tickets / Certifications</h2>
<p class="hint">Select what you currently hold.</p>

<fieldset class="fieldset">
<legend>Primary level</legend>

<label class="radio">
<input type="radio" name="level" value="EMR" required />
EMR
</label>

<label class="radio">
<input type="radio" name="level" value="PCP" />
PCP
</label>

<label class="radio">
<input type="radio" name="level" value="ACP" />
ACP
</label>

<label class="radio">
<input type="radio" name="level" value="Other" />
Other
</label>
</fieldset>
</section>

<!-- 4) LOCATION (MOVE YOUR EXISTING LOCATION SECTION HERE) -->
<!-- Keep your current Location + Preferred Locations sections below this point -->

<button type="submit" class="primary">Save Profile</button>
</form>


<section class="card">
<h2>Location</h2>
<p class="muted">City only. No full address.</p>

<button id="useLocationBtn" class="btn" type="button">Use my current location</button>
<p id="locStatus" class="tiny muted"></p>

<div class="grid2">
<div>
<label class="label">City</label>
<input id="city" class="input" type="text" placeholder="e.g., Grande Prairie" />
</div>
<div>
<label class="label">Province</label>
<select id="province" class="input">
<option value="">Select</option>
<option>BC</option><option>AB</option><option>SK</option><option>MB</option>
<option>ON</option><option>QC</option><option>NB</option><option>NS</option>
<option>PE</option><option>NL</option><option>NT</option><option>NU</option><option>YT</option>
</select>
</div>
</div>

<hr style="opacity:.2; margin: 14px 0;">

<h3>Preferred Locations</h3>
<p class="muted">Add any other cities you’re willing to work in.</p>

<div class="row">
<input id="prefLocationInput" class="input" type="text" placeholder="Add a city (e.g., Fort St. John)" />
<button id="addPrefLocationBtn" class="btn secondary" type="button">Add</button>
</div>

<div id="prefLocationsList" class="chips"></div>
</section>

<!-- Example fields -->
<input id="city" name="city" placeholder="City only. No full address." />
<input type="hidden" id="lat" name="lat" />
<input type="hidden" id="lng" name="lng" />

<button id="btnUseLocation" type="button">Use my current location</button>

<script>
const btn = document.getElementById("btnUseLocation");
const cityInput = document.getElementById("city");
const latInput = document.getElementById("lat");
const lngInput = document.getElementById("lng");

btn.addEventListener("click", async (e) => {
e.preventDefault();

if (!("geolocation" in navigator)) {
alert("Location not supported on this browser.");
return;
}

btn.disabled = true;
btn.textContent = "Getting location...";

navigator.geolocation.getCurrentPosition(
async (pos) => {
try {
const { latitude, longitude } = pos.coords;
latInput.value = latitude;
lngInput.value = longitude;

// Reverse geocode to city (no full address)
const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`;
const res = await fetch(url, {
headers: {
// Nominatim likes a User-Agent, but browsers restrict it;
// this is usually fine for light testing. For production, use your own geocoder.
"Accept": "application/json"
}
});
const data = await res.json();

const addr = data.address || {};
const city =
addr.city || addr.town || addr.village || addr.hamlet || addr.county || "";

if (!city) {
alert("Got coordinates, but couldn’t detect a city name.");
} else {
cityInput.value = city;
}
} catch (err) {
console.error(err);
alert("Location found, but city lookup failed.");
} finally {
btn.disabled = false;
btn.textContent = "Use my current location";
}
},
(err) => {
console.warn(err);
let msg = "Couldn’t get your location.";
if (err.code === 1) msg = "Location permission denied. Allow it in browser settings.";
if (err.code === 2) msg = "Location unavailable (GPS/network).";
if (err.code === 3) msg = "Location request timed out. Try again.";
alert(msg);

btn.disabled = false;
btn.textContent = "Use my current location";
},
{
enableHighAccuracy: false,
timeout: 10000,
maximumAge: 60000,
}
);
});
</script>
